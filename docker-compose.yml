version: "3.9"

services:
  # ─── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: cineai_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cineai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cineai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cineai_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cineai} -d ${POSTGRES_DB:-cineai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cineai_network

  # ─── MLflow Tracking Server ─────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: cineai_mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"
    networks:
      - cineai_network

  # ─── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cineai_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cineai}:${POSTGRES_PASSWORD:-cineai_secret}@postgres:5432/${POSTGRES_DB:-cineai_db}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./backend:/app
      - model_artifacts:/app/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - cineai_network
    command: >
      sh -c "alembic upgrade head &&
             python data/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ─── React Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cineai_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - cineai_network

  # ─── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cineai_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
    networks:
      - cineai_network

volumes:
  postgres_data:
  mlflow_data:
  model_artifacts:

networks:
  cineai_network:
    driver: bridge
